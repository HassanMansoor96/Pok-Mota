<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory admin | PokéMota</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body><header class="admin-header"><a class="brand" href="index.html">POKÉ<span class="brand-accent">MOTA</span></a><span>INVENTORY MANAGEMENT</span><button id="logout" class="btn btn-outline" hidden>LOG OUT</button></header><main class="admin-main"><section id="login-view" class="admin-panel"><div class="eyebrow gold-text">PRIVATE ADMIN</div><h1>WELCOME <em>BACK.</em></h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="btn btn-gold" type="submit">SIGN IN</button></form></section><section id="admin-view" hidden><div class="admin-top"><div><div class="eyebrow gold-text">THE COLLECTOR'S VAULT</div><h1>YOUR <em>INVENTORY.</em></h1><p>Create and edit stock. Only published items appear in the storefront.</p></div><button id="new-product" class="btn btn-gold">+ CREATE PRODUCT</button></div><div class="admin-table-wrap"><table><thead><tr><th>PRODUCT</th><th>SET</th><th>PRICE</th><th>STOCK</th><th>VISIBILITY</th><th>ACTION</th></tr></thead><tbody id="product-rows"></tbody></table></div><div id="form-panel" class="admin-panel" hidden><h2 id="form-title">CREATE PRODUCT</h2><form id="product-form"><div class="admin-fields"><label>Name *<input name="name" maxlength="160" required></label><label>Set *<input name="set" maxlength="120" required></label><label>Card number / format<input name="number" maxlength="60"></label><label>Category *<select name="category"><option value="single">Single</option><option value="sealed">Sealed</option></select></label><label>Rarity<input name="rarity" maxlength="100"></label><label>Condition<input name="condition" maxlength="80" placeholder="Near Mint"></label><label>Price (ZAR) *<input name="price" type="number" min="0" max="1000000" step="0.01" required></label><label>Stock *<input name="stock" type="number" min="0" max="1000000" step="1" required></label><label>Theme<select name="theme"><option>mint</option><option>ember</option><option>electric</option><option>ghost</option><option>prism</option><option>shadow</option></select></label><label>Decorative art symbol<input name="art" maxlength="12" value="✦"></label><label>Badge<input name="tag" maxlength="50" placeholder="COLLECTOR PICK"></label><label>HTTPS image URL (optional)<input name="imageUrl" type="url" maxlength="500" placeholder="https://…"></label><label class="wide">Description<textarea name="description" rows="4" maxlength="3000"></textarea></label><label class="checkbox-field wide"><input type="checkbox" name="isPublished"> Publish on storefront</label></div><div class="admin-actions"><button class="btn btn-gold" type="submit" id="save-product">SAVE PRODUCT</button><button class="btn btn-outline" type="button" id="cancel-edit">CANCEL</button></div></form></div></section><p id="message" role="status" aria-live="polite"></p></main></body></html>
